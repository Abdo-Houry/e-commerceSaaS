services:
  postgres:
    image: postgres:16-alpine
    container_name: matjari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-matjari}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-matjari}
      POSTGRES_DB: ${DB_NAME:-matjari}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-matjari}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
