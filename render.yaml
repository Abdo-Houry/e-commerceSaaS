# Render blueprint for the Express API.
# The Next.js frontend is deployed separately on Vercel and the database is any managed
# PostgreSQL 16+ (Render Postgres, Neon, Supabase…) passed in as DATABASE_URL.
services:
  - type: web
    name: matjari-api
    runtime: node
    plan: free
    region: ohio
    # --include=dev: Render sets NODE_ENV=production, which would otherwise skip TypeScript.
    buildCommand: npm ci --include=dev && npm run build -w @matjari/shared && npm run build -w @matjari/api
    # Migrations run from the compiled build, so no shell access is needed on the host.
    startCommand: npm run migrate -w @matjari/api && npm run start -w @matjari/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Damascus
      # Public showcase instance: seeds the demo data and the admin account on first boot,
      # and restores the demo images whenever the free tier's ephemeral disk loses them.
      - key: DEMO_MODE
        value: 'true'
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      # Set these to the frontend's URL once it is deployed.
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_PUBLIC_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
